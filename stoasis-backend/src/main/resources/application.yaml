spring:
  application:
    name: stoasis-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: never

stoasis:
  mcp:
    public-url: ${STOASIS_MCP_PUBLIC_URL:http://localhost:3000/mcp}
  features:
    skills-enabled: ${STOASIS_SKILLS_ENABLED:true}
  public-api-base-url: ${STOASIS_PUBLIC_API_URL:http://localhost:4000}
  cors:
    allowed-origins: ${STOASIS_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8080}
  auth:
    frontend-base-url: ${STOASIS_FRONTEND_URL:http://localhost:4200}
    mail-from: ${STOASIS_MAIL_FROM:no-reply@stoasis.local}
    mail-provider: ${STOASIS_MAIL_PROVIDER:smtp}
    resend-api-key: ${RESEND_API_KEY:}
    resend-api-url: ${RESEND_API_URL:https://api.resend.com/emails}

server:
  address: 0.0.0.0
  port: ${PORT:4000}
  servlet:
    session:
      cookie:
        name: stoasis_session
        http-only: true
        same-site: lax
      timeout: 30d

management:
  endpoints:
    web:
      exposure:
        include: health,info
