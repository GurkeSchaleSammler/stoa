spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: false
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

stoasis:
  features:
    skills-enabled: ${STOASIS_SKILLS_ENABLED:false}
  public-api-base-url: ${STOASIS_PUBLIC_API_URL:https://stoasis.gurkeschale.dev}
  cors:
    allowed-origins: ${STOASIS_CORS_ALLOWED_ORIGINS:https://stoasis.gurkeschale.dev}
  auth:
    frontend-base-url: ${STOASIS_FRONTEND_URL:https://stoasis.gurkeschale.dev}

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

logging:
  level:
    com.stoasis.backend: INFO

management:
  health:
    mail:
      enabled: false
